services:
    rabbitmq:
        image: rabbitmq:management
        container_name: rabbit_d2
        ports: 
            - "5672:5672"
            - "15672:15672"
        networks:
            - api

    library_webapi_d2:
        build:
            context: ./Library.WebApi
            dockerfile: Dockerfile
        container_name: lib_wapi_d2c
        ports: 
            - "91:8080"
        environment:
            - RabbitMq__ServerAddress=rabbitmq://rabbitmq
            - RabbitMq__Username=guest
            - RabbitMq__Password=guest
        networks:
            - api
        depends_on:
            - rabbitmq

    library_web_d2:
        build:
            context: ./Library.Web
            dockerfile: Dockerfile
        container_name: lib_web_d2c
        ports: 
            - "90:8080"
        environment:
            - LibraryWebApiServiceHost=http://library_webapi_d2:8080
        networks:
            - api
        depends_on:
            - library_webapi_d2

    library_ns2_d2:
        build:
            context: ./Library.NotificationService2
            dockerfile: Dockerfile
        container_name: lib_nt2_d2c
        ports: 
            - "92:8080"
        environment:
            - RabbitMq__ServerAddress=rabbitmq://rabbitmq
            - RabbitMq__Username=guest
            - RabbitMq__Password=guest
        networks:
            - api
        depends_on:
            - rabbitmq

networks:
    api:
        driver: bridge